<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionnaire de scène — Prototype</title>
<style>
  :root {
    --bg-void: #0a0e12;
    --panel: #10171d;
    --panel-edge: #1c2830;
    --ink: #d8e2e6;
    --ink-dim: #7c8f97;
    --gold: #c9a961;
    --gold-soft: rgba(201, 169, 97, 0.35);
    --danger: #8a3a3a;
    --edit: #4a90a4;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-void);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- Topbar ---------- */
  #topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-edge);
    flex-shrink: 0;
    z-index: 50;
  }
  #topbar .title {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: var(--gold);
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .mode-switch {
    display: flex;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-switch button {
    background: none;
    border: none;
    color: var(--ink-dim);
    padding: 7px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .mode-switch button.active {
    background: var(--gold-soft);
    color: var(--gold);
  }
  .mode-switch button:hover:not(.active) {
    color: var(--ink);
    background: rgba(255,255,255,0.04);
  }
  #breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--ink-dim);
    flex-wrap: wrap;
    flex: 1;
    min-width: 0;
  }
  #breadcrumb .crumb {
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  #breadcrumb .crumb:hover { background: rgba(255,255,255,0.06); color: var(--ink); }
  #breadcrumb .crumb.current { color: var(--gold); cursor: default; }
  #breadcrumb .crumb.current:hover { background: none; }
  #breadcrumb .sep { color: var(--panel-edge); }

  #audio-toggle {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #audio-toggle.on { color: var(--gold); border-color: var(--gold-soft); }

  #disk-open-root {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #disk-scene-select {
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.8rem;
    max-width: 160px;
  }
  #disk-delete-scene {
    background: none;
    border: 1px solid var(--danger);
    color: #e08a8a;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }

  #draw-toggle {
    background: none;
    border: 1px solid var(--edit);
    color: var(--edit);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    display: none;
  }
  body.mode-edit #draw-toggle { display: inline-block; }
  #draw-toggle.on { background: var(--edit); color: #06181e; }

  /* ---------- Layout ---------- */
  #body-layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #stage-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    min-width: 0;
  }
  #stage {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 768 / 512;
    width: min(100%, calc((100vh - 60px) * 768 / 512));
  }
  #stage img.bg {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }
  #stage svg.zones {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .zone-shape {
    fill: rgba(201, 169, 97, 0.0);
    stroke: transparent;
    stroke-width: 2;
    cursor: pointer;
    transition: fill .15s, stroke .15s;
    vector-effect: non-scaling-stroke;
  }
  body.mode-edit .zone-shape {
    fill: rgba(74, 144, 164, 0.12);
    stroke: var(--edit);
    stroke-dasharray: 6 4;
  }
  body.mode-mj .zone-shape {
    stroke: rgba(201, 169, 97, 0.25);
  }
  body.mode-mj .zone-shape:hover,
  body.mode-edit .zone-shape:hover {
    fill: rgba(201, 169, 97, 0.18);
    stroke: var(--gold);
  }
  .zone-shape.sound-on {
    stroke: var(--gold);
    stroke-width: 3;
    animation: pulse-stroke 1.8s ease-in-out infinite;
  }
  @keyframes pulse-stroke {
    0%, 100% { stroke-opacity: 0.5; }
    50% { stroke-opacity: 1; }
  }
  .zone-label {
    position: absolute;
    transform: translate(-50%, -100%);
    background: var(--bg-void);
    color: var(--gold);
    font-size: 0.72rem;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid var(--gold-soft);
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .15s;
  }
  body.mode-edit .zone-label { opacity: 1; }
  .zone-shape:hover + .zone-label { opacity: 1; }

  /* ---------- Inserts (cascade) ---------- */
  #insert-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .insert-card {
    position: absolute;
    pointer-events: auto;
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    width: 78%;
    height: 78%;
    top: 11%;
    left: 11%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: insert-in .28s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes insert-in {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .insert-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--bg-void);
    border-bottom: 1px solid var(--panel-edge);
    flex-shrink: 0;
  }
  .insert-head .name {
    font-size: 0.85rem;
    color: var(--gold);
  }
  .insert-head .close-btn {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 6px;
    width: 26px;
    height: 26px;
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
  }
  .insert-head .close-btn:hover { color: var(--ink); border-color: var(--gold-soft); }
  .insert-body {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  .insert-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 20px;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, #162026, #0d1216);
  }
  .insert-placeholder .icon { font-size: 2.2rem; opacity: 0.8; }
  .insert-placeholder .cap { color: var(--ink-dim); font-size: 0.8rem; max-width: 320px; }

  /* ---------- Portrait (visuel partagé : zones legacy + NPC) ---------- */
  @keyframes portrait-in {
    from { opacity: 0; transform: translate(-50%, 40px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .portrait-visual {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .portrait-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 14px 28px rgba(0,0,0,0.65));
  }
  .portrait-placeholder {
    width: 100%;
    height: 75%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(160deg, #162026, #0d1216);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
  }
  .portrait-name {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 20, 24, 0.9);
    border: 1px solid var(--gold-soft);
    color: var(--gold);
    padding: 4px 16px;
    border-radius: 6px;
    font-size: 0.8rem;
    white-space: nowrap;
    z-index: 5;
  }

  .portrait-card {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 88%;
    pointer-events: auto;
    animation: portrait-in 0.25s ease-out;
  }
  .portrait-card .portrait-close {
    position: absolute;
    top: 0;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--panel-edge);
    background: rgba(10, 20, 24, 0.85);
    color: var(--ink-dim);
    cursor: pointer;
    z-index: 5;
  }
  .portrait-card .portrait-close:hover { color: var(--ink); border-color: var(--gold-soft); }

  /* ---------- Portraits NPC (panneau "Personnages") ---------- */
  #npc-portrait-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .npc-portrait {
    position: absolute;
    bottom: 0;
    transform: translateX(-50%);
    height: 88%;
    pointer-events: none;
    animation: portrait-in 0.25s ease-out;
    z-index: 8;
  }

  /* ---------- Side panel ---------- */
  #side-panel {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--panel-edge);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  #side-panel h3 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin: 14px 14px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #npc-refresh {
    background: none;
    border: none;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    text-transform: none;
    letter-spacing: normal;
  }
  #npc-refresh:hover { color: var(--gold); }
  #npc-checklist { padding-bottom: 10px; }
  #npc-checklist .empty {
    color: var(--ink-dim);
    font-style: italic;
    font-size: 0.8rem;
    padding: 0 14px;
    display: block;
  }
  .npc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    font-size: 0.85rem;
    color: var(--ink);
    cursor: pointer;
  }
  .npc-row:hover { background: rgba(255,255,255,0.03); }
  .npc-row input[type="checkbox"] { cursor: pointer; }
  .accordion-item {
    border-bottom: 1px solid var(--panel-edge);
  }
  .accordion-item .acc-head {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 0.88rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--ink);
  }
  .accordion-item .acc-head:hover { background: rgba(255,255,255,0.03); }
  .accordion-item .acc-arrow {
    transition: transform .15s;
    color: var(--gold);
    font-size: 0.75rem;
  }
  .accordion-item.open .acc-arrow { transform: rotate(90deg); }
  .accordion-item .acc-body {
    max-height: 0;
    overflow-y: auto;
    transition: max-height .2s ease;
    font-size: 0.82rem;
    color: var(--ink-dim);
    line-height: 1.5;
  }
  .accordion-item.open .acc-body { max-height: 220px; }
  .accordion-item .acc-body-inner { padding: 0 14px 14px; }

  .zone-info-box {
    margin: 10px 14px;
    padding: 12px;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    font-size: 0.82rem;
  }
  .zone-info-box .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .zone-info-box .row .k { color: var(--ink-dim); }
  .zone-info-box .row .v { color: var(--ink); text-align: right; }
  .zone-info-box .empty { color: var(--ink-dim); font-style: italic; }
  .zone-info-box .zi-label {
    display: block;
    font-size: 0.72rem;
    color: var(--ink-dim);
    margin: 2px 0 4px;
  }
  .zone-info-box input[type="text"],
  .zone-info-box select {
    width: 100%;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .zone-info-box .zi-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }
  .zone-info-box .zi-actions button {
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    border: 1px solid var(--edit);
    background: none;
    color: var(--edit);
  }
  .zone-info-box .zi-actions button.danger {
    border-color: var(--danger);
    color: #e08a8a;
  }

  /* ---------- Player mode: strip everything ---------- */
  body.mode-player #topbar,
  body.mode-player #side-panel,
  body.mode-player .zone-label {
    display: none !important;
  }
  body.mode-player .zone-shape { stroke: transparent !important; fill: transparent !important; cursor: default; }
  body.mode-player #body-layout { }
  body.mode-player #stage-wrap { background: #000; }

  body.drawing-mode .zone-shape:not(.draw-vertex) { pointer-events: none; }
  body.drawing-mode #stage { cursor: crosshair; }

  .draw-capture {
    fill: transparent;
    pointer-events: all;
  }
  .draw-vertex {
    fill: var(--gold);
    stroke: #06181e;
    stroke-width: 1.5;
    r: 5;
    vector-effect: non-scaling-stroke;
  }
  .draw-preview-line {
    fill: rgba(74, 144, 164, 0.15);
    stroke: var(--edit);
    stroke-width: 2;
    stroke-dasharray: 5 4;
    vector-effect: non-scaling-stroke;
  }

  .draw-hint-bar {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    color: var(--ink);
    background: rgba(10, 20, 24, 0.9);
    border: 1px solid var(--edit);
    padding: 6px 14px;
    border-radius: 8px;
    z-index: 60;
    white-space: nowrap;
  }

  .zone-form-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 70;
  }
  .zone-form {
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
    padding: 20px;
    width: 300px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }
  .zone-form h4 {
    margin: 0 0 14px;
    color: var(--gold);
    font-size: 0.95rem;
    font-weight: 500;
  }
  .zone-form label {
    display: block;
    font-size: 0.75rem;
    color: var(--ink-dim);
    margin: 10px 0 4px;
  }
  .zone-form input[type="text"],
  .zone-form select {
    width: 100%;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    padding: 7px 9px;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .zone-form .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .zone-form button {
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    border: 1px solid var(--panel-edge);
    background: none;
    color: var(--ink-dim);
  }
  .zone-form button.primary {
    background: var(--gold-soft);
    border-color: var(--gold);
    color: var(--gold);
  }
  .zone-form .note {
    font-size: 0.72rem;
    color: var(--ink-dim);
    margin-top: 12px;
    line-height: 1.4;
  }

  .hint {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.72rem;
    color: var(--ink-dim);
    background: rgba(0,0,0,0.5);
    padding: 4px 10px;
    border-radius: 12px;
    pointer-events: none;
  }
</style>
</head>
<body class="mode-mj">
<div id="app">

  <div id="topbar">
    <div class="title">Ombres de Chicago — Bureau de Francis</div>
    <div class="mode-switch">
      <button data-mode="edit">Édition</button>
      <button data-mode="mj" class="active">MJ</button>
      <button data-mode="player">Joueur</button>
    </div>
    <button id="disk-open-root">📁 Dossier scénario</button>
    <select id="disk-scene-select" style="display:none;"></select>
    <button id="disk-delete-scene" style="display:none;">🗑️ Supprimer la scène</button>
    <div id="breadcrumb"></div>
    <button id="draw-toggle">✏️ Créer une zone</button>
    <button id="audio-toggle">🔈 Activer le son</button>
  </div>

  <div id="body-layout">
    <div id="stage-wrap">
      <div id="stage">
        <img class="bg" id="scene-bg" src="" alt="Décor de la scène">
        <svg class="zones" id="zone-svg" viewBox="0 0 768 512" preserveAspectRatio="none"></svg>
        <div id="labels-layer"></div>
        <div id="npc-portrait-layer"></div>
        <div id="insert-layer"></div>
        <div class="hint" id="mode-hint"></div>
      </div>
    </div>
    <div id="side-panel">
      <h3>Zone sélectionnée</h3>
      <div id="zone-info" class="zone-info-box"><span class="empty">Clique une zone pour voir ses réglages.</span></div>

      <h3>Notes de scénario</h3>
      <div id="accordion"></div>

      <h3>Personnages <button id="npc-refresh" title="Actualiser la liste">🔄</button></h3>
      <div id="npc-checklist"></div>
    </div>
  </div>

  function fsApiSupported() {
    return "showDirectoryPicker" in window;

  function showToast(msg, isError) {
    let t = document.getElementById("disk-toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "disk-toast";
      t.className = "hint";
      t.style.top = "10px";
      t.style.bottom = "auto";
      document.getElementById("stage").appendChild(t);
    }
    t.textContent = msg;
    t.style.borderColor = isError ? "var(--danger)" : "var(--gold-soft)";
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => { if (t.parentNode) t.remove(); }, 4000);
  }

  async function writeFileIntoDir(dirHandle, fileName, fileObj) {
    const fh = await dirHandle.getFileHandle(fileName, { create: true });
    const w = await fh.createWritable();
    await w.write(fileObj);
    await w.close();
  }

  async function writeJsonIntoDir(dirHandle, fileName, obj) {
    const fh = await dirHandle.getFileHandle(fileName, { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(obj, null, 2));
    await w.close();
  }

  function cleanForSave(list) {
    return JSON.parse(JSON.stringify(list, (key, val) => (key && key.indexOf("_") === 0) ? undefined : val));
  }

  async function saveSceneToDisk() {
    if (!diskMode || !currentSceneDirHandle) return;
    try {
      const sceneData = {
        name: loadedSceneNames[currentSceneName] || currentSceneName,
        background: currentSceneMeta.background,
        music: currentSceneMeta.music,
        zones: cleanForSave(ZONES),
        activeNpcs: activeNpcOrder.slice()
      };
      await writeJsonIntoDir(currentSceneDirHandle, "scene.json", sceneData);
    } catch (e) {
      showToast("Échec de l'enregistrement sur disque.", true);
    }
  }

  async function hydrateAssetURLs(list, sceneDir) {
    for (const z of list) {
      if ((z.type === "image" || z.type === "personnage") && z.insert && z.insert.assetFile) {
        try {
          const inserts = await sceneDir.getDirectoryHandle("inserts");
          const fh = await inserts.getFileHandle(z.insert.assetFile);
          const file = await fh.getFile();
          z.insert._url = URL.createObjectURL(file);
        } catch (e) {}
      }
      if (z.type === "son" && z.assetFile) {
        try {
          const sons = await sceneDir.getDirectoryHandle("sons");
          const fh = await sons.getFileHandle(z.assetFile);
          const file = await fh.getFile();
          z._url = URL.createObjectURL(file);
        } catch (e) {}
      }
      if (z.insert && z.insert.nested) await hydrateAssetURLs(z.insert.nested, sceneDir);
    }
  }

  // Personnages (dossier "npc" partagé, roster à cocher par scène)

  function deriveNpcName(fileName) {
    let base = fileName.replace(/\.[^.]+$/, "");
    let tokens = base.split(/[_\-\s]+/).filter(Boolean);
    tokens = tokens.filter(t => t.toLowerCase() !== "npc" && t.toLowerCase() !== "pnj");
    if (tokens.length === 0) tokens = [base];
    return tokens.map(t => t.charAt(0).toUpperCase() + t.slice(1)).join(" ");
  }

  async function scanNpcFolder() {
    npcList = [];
    // on vide le cache d'images pour forcer une relecture depuis le disque
    // (utile si un fichier a été remplacé en gardant le même nom)
    Object.keys(npcObjectURLs).forEach(fileName => {
      try { URL.revokeObjectURL(npcObjectURLs[fileName]); } catch (e) {}
      delete npcObjectURLs[fileName];
    });
    if (!rootDirHandle) { renderNpcChecklist(); return; }
    try {
      npcDirHandle = await rootDirHandle.getDirectoryHandle("npc", { create: true });
      for await (const [name, handle] of npcDirHandle.entries()) {
        if (handle.kind === "file" && /\.(png|jpe?g|webp|gif)$/i.test(name)) {
          npcList.push({ fileName: name, displayName: deriveNpcName(name) });
        }
      }
      npcList.sort((a, b) => a.displayName.localeCompare(b.displayName));
    } catch (e) {
      showToast('Impossible de lire le dossier "npc".', true);
    }
    renderNpcChecklist();
    if (activeNpcOrder.length) await hydrateActiveNpcImages();
  }

  function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => resolve({ img, url });
      img.onerror = reject;
      img.src = url;
    });
  }

  async function trimTransparentPadding(file) {
    try {
      const { img, url } = await loadImageFromFile(file);
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      let data;
      try {
        data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      } catch (e) {
        return url; // lecture bloquée (rare en local) : on garde l'image telle quelle
      }
      let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
      const threshold = 10;
      const step = canvas.width * canvas.height > 4000000 ? 2 : 1; // sous-échantillonnage si grande image
      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          const alpha = data[(y * canvas.width + x) * 4 + 3];
          if (alpha > threshold) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < minX || maxY < minY) return url; // image vide ou sans transparence exploitable
      const w = maxX - minX + 1;
      const h = maxY - minY + 1;
      // pas de recadrage utile si la transparence occupe une part négligeable
      if (w >= canvas.width * 0.98 && h >= canvas.height * 0.98) return url;
      const outCanvas = document.createElement("canvas");
      outCanvas.width = w;
      outCanvas.height = h;
      outCanvas.getContext("2d").drawImage(canvas, minX, minY, w, h, 0, 0, w, h);
      URL.revokeObjectURL(url);
      return await new Promise((resolve) => {
        outCanvas.toBlob((blob) => resolve(blob ? URL.createObjectURL(blob) : url), "image/png");
      });
    } catch (e) {
      return URL.createObjectURL(file);
    }
  }

  async function ensureNpcObjectURL(fileName) {
    if (npcObjectURLs[fileName]) return npcObjectURLs[fileName];
    if (!npcDirHandle) return null;
    try {
      const fh = await npcDirHandle.getFileHandle(fileName);
      const file = await fh.getFile();
      const url = await trimTransparentPadding(file);
      npcObjectURLs[fileName] = url;
      renderNpcPortraits();
      return url;
    } catch (e) {
      return null;
    }
  }

  async function hydrateActiveNpcImages() {
    for (const fileName of activeNpcOrder) {
      if (!npcObjectURLs[fileName]) await ensureNpcObjectURL(fileName);
    }
    renderNpcPortraits();
  }

  function renderNpcChecklist() {
    const el = document.getElementById("npc-checklist");
    if (!diskMode) {
      el.innerHTML = '<span class="empty">Ouvre un dossier de scénario pour gérer les personnages.</span>';
      return;
    }
    if (!npcList.length) {
      el.innerHTML = '<span class="empty">Aucune image dans le dossier "npc". Ajoute des fichiers (ex. john_npc.jpg) puis actualise.</span>';
      return;
    }
    el.innerHTML = npcList.map(n => {
      const checked = activeNpcOrder.includes(n.fileName) ? "checked" : "";
      return '<label class="npc-row"><span>' + n.displayName + '</span><input type="checkbox" data-fname="' + escapeAttr(n.fileName) + '" ' + checked + '></label>';
    }).join("");
    el.querySelectorAll("input[type=checkbox]").forEach(cb => {
      cb.addEventListener("change", () => toggleNpc(cb.dataset.fname, cb.checked));
    });
  }

  async function toggleNpc(fileName, isChecked) {
    if (isChecked) {
      if (!activeNpcOrder.includes(fileName)) {
        if (activeNpcOrder.length >= 4) {
          showToast("4 personnages maximum affichés en même temps.", true);
          renderNpcChecklist();
          return;
        }
        activeNpcOrder.push(fileName);
        await ensureNpcObjectURL(fileName);
      }
    } else {
      activeNpcOrder = activeNpcOrder.filter(f => f !== fileName);
    }
    if (diskMode) saveSceneToDisk();
    broadcastState();
    renderNpcPortraits();
  }

  function renderNpcPortraits() {
    const layer = document.getElementById("npc-portrait-layer");
    layer.innerHTML = "";
    const active = activeNpcOrder.slice(0, 4);
    const widthByCount = { 1: 34, 2: 26, 3: 20, 4: 20 };
    const w = widthByCount[active.length] || 20;
    active.forEach((fileName, i) => {
      const card = document.createElement("div");
      card.className = "npc-portrait";
      card.style.left = SLOT_POSITIONS[i];
      card.style.width = w + "%";
      const url = npcObjectURLs[fileName];
      const entry = npcList.find(n => n.fileName === fileName);
      const displayName = entry ? entry.displayName : fileName;
      card.innerHTML =
        '<div class="portrait-visual">' +
          (url ? '<img class="portrait-img" src="' + url + '">' : '<div class="portrait-placeholder"><div class="icon">🧍</div></div>') +
        '</div>' +
        '<div class="portrait-name">' + displayName + '</div>';
      layer.appendChild(card);
    });
  }

  document.getElementById("npc-refresh").addEventListener("click", scanNpcFolder);


  async function loadSceneFromDisk(folderName) {
    let sceneDir;
    try {
      sceneDir = await rootDirHandle.getDirectoryHandle(folderName);
    } catch (e) {
      showToast("Dossier de scène introuvable.", true);
      return;
    }
    let sceneData;
    try {
      const jsonFh = await sceneDir.getFileHandle("scene.json");
      const jsonFile = await jsonFh.getFile();
      sceneData = JSON.parse(await jsonFile.text());
    } catch (e) {
      sceneData = { name: folderName, background: null, music: null, zones: [] };
    }

    if (bgObjectURL) URL.revokeObjectURL(bgObjectURL);
    bgObjectURL = null;
    if (sceneData.background) {
      try {
        const fh = await sceneDir.getFileHandle(sceneData.background);
        const file = await fh.getFile();
        bgObjectURL = URL.createObjectURL(file);
      } catch (e) {}
    }

    if (musicObjectURL) URL.revokeObjectURL(musicObjectURL);
    musicObjectURL = null;
    musicAudioEl.pause();
    if (sceneData.music) {
      try {
        const musiquesDir = await sceneDir.getDirectoryHandle("musiques");
        const fh = await musiquesDir.getFileHandle(sceneData.music);
        const file = await fh.getFile();
        musicObjectURL = URL.createObjectURL(file);
      } catch (e) {}
    }
    musicAudioEl.src = musicObjectURL || "";

    diskMode = true;
    currentSceneDirHandle = sceneDir;
    currentSceneName = folderName;
    currentSceneMeta = { background: sceneData.background, music: sceneData.music };
    loadedSceneNames[folderName] = sceneData.name || folderName;

    ZONES.length = 0;
    (sceneData.zones || []).forEach(z => ZONES.push(z));
    await hydrateAssetURLs(ZONES, sceneDir);

    activeNpcOrder = Array.isArray(sceneData.activeNpcs) ? sceneData.activeNpcs.slice() : [];

    state.sceneId = folderName;
    state.insertStack = [];
    state.selectedZoneId = null;
    diskSceneSelect.value = folderName;
    diskDeleteBtn.style.display = "inline-block";
    diskDeleteBtn.dataset.confirm = "";
    diskDeleteBtn.textContent = "🗑️ Supprimer la scène";

    if (state.audioEnabled) {
      stopAmbient();
      if (musicObjectURL) musicAudioEl.play().catch(() => {});
    }

    broadcastState();
    render();
    hydrateActiveNpcImages();
  }

  async function createSceneOnDisk(name, bgFile, musicFile) {
    const folderName = slugify(name) || ("scene-" + Date.now());
    const sceneDir = await rootDirHandle.getDirectoryHandle(folderName, { create: true });
    await sceneDir.getDirectoryHandle("inserts", { create: true });
    await sceneDir.getDirectoryHandle("sons", { create: true });
    await sceneDir.getDirectoryHandle("musiques", { create: true });

    const bgExt = (bgFile.name.split(".").pop() || "jpg").toLowerCase();
    const bgDestName = "background." + bgExt;
    await writeFileIntoDir(sceneDir, bgDestName, bgFile);

    let musicDestName = null;
    if (musicFile) {
      const musiquesDir = await sceneDir.getDirectoryHandle("musiques", { create: true });
      const mExt = (musicFile.name.split(".").pop() || "mp3").toLowerCase();
      musicDestName = "musique." + mExt;
      await writeFileIntoDir(musiquesDir, musicDestName, musicFile);
    }

    const sceneData = { name: name, background: bgDestName, music: musicDestName, zones: [], activeNpcs: [] };
    await writeJsonIntoDir(sceneDir, "scene.json", sceneData);
    return folderName;
  }

  // ---------------------------------------------------------------
  // Audio (Web Audio synthétisé — simule les 3 comportements sonores)
  // ---------------------------------------------------------------

  let actx = null;
  let ambientNode = null;
  let superposeNode = null;

  function ensureAudio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  }

  function startAmbient(hue) {
    stopAmbient();
    const ctx = ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 90 + hue * 0.15;
    gain.gain.value = 0.04;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    ambientNode = { osc, gain };
  }
  function stopAmbient() {
    if (ambientNode) { try { ambientNode.osc.stop(); } catch (e) {} ambientNode = null; }
  }
  function toggleSuperpose(on) {
    if (on) {
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = 3.2; // rythme lent façon machine à laver
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.05;
      osc.connect(lfoGain).connect(ctx.destination);
      osc.start();
      superposeNode = { osc };
    } else if (superposeNode) {
      try { superposeNode.osc.stop(); } catch (e) {}
      superposeNode = null;
    }
  }
  function playSting() {
    const ctx = ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  }

  audioBtn.addEventListener("click", () => {
    state.audioEnabled = !state.audioEnabled;
    audioBtn.classList.toggle("on", state.audioEnabled);
    audioBtn.textContent = state.audioEnabled ? "🔊 Son activé" : "🔈 Activer le son";
    if (state.audioEnabled) {
      if (diskMode) {
        if (musicObjectURL) musicAudioEl.play().catch(() => {});
      } else {
        startAmbient(SCENES[state.sceneId].musicHue);
      }
    } else {
      stopAmbient();
      toggleSuperpose(false);
      musicAudioEl.pause();
    }
  });

  // ---------------------------------------------------------------
  // Résolution d'un chemin d'inserts (pour retrouver une zone imbriquée)
  // ---------------------------------------------------------------

  function findZoneAtLevel(stack) {
    // stack = liste d'ids de zones ouvertes, dans l'ordre. Renvoie la liste
    // de zones à afficher au niveau courant (racine si stack vide).
    let list = ZONES;
    let current = null;
    for (const id of stack) {
      current = list.find(z => z.id === id);
      if (!current || !current.insert || !current.insert.nested) return { list: [], current };
      list = current.insert.nested;
    }
    return { list, current };
  }

  function getZoneById(id, stack) {
    const { list } = findZoneAtLevel(stack.slice(0, -1));
    return list.find(z => z.id === id);
  }

  // ---------------------------------------------------------------

  function render() {
    body.className = "mode-" + state.mode;
    sceneBg.src = diskMode ? (bgObjectURL || "") : window.__SCENE_IMG__;
    renderBaseZones();
    renderInserts();
    renderNpcPortraits();

  function renderBaseZones() {
    svg.innerHTML = "";
    labelsLayer.innerHTML = "";
    if (state.insertStack.length > 0) return; // zones racine masquées si un insert est ouvert
    for (const zone of ZONES) {
      svg.appendChild(makeShape(zone, []));
      labelsLayer.appendChild(makeLabel(zone));
    }
  }

  function makeShape(zone, parentStack) {
    const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    poly.setAttribute("points", zone.points);
    poly.classList.add("zone-shape");
    poly.dataset.zoneId = zone.id;
    if (zone.type === "son" && zone.soundMode === "superpose" && state.soundOn[zone.id]) {
      poly.classList.add("sound-on");
    }
    poly.addEventListener("click", () => onZoneClick(zone, parentStack));
    return poly;
  }

  function centroid(pointsAttr) {
    const pts = pointsAttr.trim().split(/\s+/).map(p => p.split(",").map(Number));
    const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
    const cy = Math.min(...pts.map(p => p[1]));
    return { x: cx, y: cy };
  }

  function makeLabel(zone) {
    const div = document.createElement("div");
    div.className = "zone-label";
    div.textContent = zone.icon + " " + zone.name;
    const c = centroid(zone.points);
    const stageBox = document.getElementById("stage").getBoundingClientRect();
    div.style.left = (c.x / 768 * 100) + "%";
    div.style.top = (c.y / 512 * 100) + "%";
    return div;
  }

  function renderInserts() {
    insertLayer.innerHTML = "";
    let depth = 0;
    let stack = [];
    for (const id of state.insertStack) {
      const { list } = findZoneAtLevel(stack);
      const zone = list.find(z => z.id === id);
      if (!zone) break;
      const cardEl = zone.type === "personnage" ? makePortraitCard(zone, depth, stack.slice()) : makeInsertCard(zone, depth, stack.slice());
      insertLayer.appendChild(cardEl);
      stack.push(id);
      depth++;
    }
    // zones imbriquées du niveau courant (à l'intérieur du dernier insert affiché)
    if (state.insertStack.length > 0) {
      const lastCard = insertLayer.lastElementChild;
      if (lastCard) {
        const svgWrap = lastCard.querySelector(".insert-zone-svg");
        const { list } = findZoneAtLevel(state.insertStack);
        if (svgWrap && list.length) {
          for (const zone of list) {
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute("points", zone.points);
            poly.classList.add("zone-shape");
            poly.dataset.zoneId = zone.id;
            poly.addEventListener("click", (e) => {
              e.stopPropagation();
              onZoneClick(zone, state.insertStack.slice());
            });
            svgWrap.appendChild(poly);
          }
        }
      }
    }
  }

  function makePortraitCard(zone, depth, parentStack) {
    const card = document.createElement("div");
    card.className = "portrait-card";
    card.style.zIndex = 20 + depth;

    const closeBtn = document.createElement("button");
    closeBtn.className = "portrait-close";
    closeBtn.textContent = "✕";
    closeBtn.title = "Fermer";
    closeBtn.addEventListener("click", () => setInsertStack(parentStack));

    const visual = document.createElement("div");
    visual.className = "portrait-visual";
    if (zone.insert._url) {
      visual.innerHTML = '<img class="portrait-img" src="' + zone.insert._url + '">';
    } else {
      visual.innerHTML =
        '<div class="portrait-placeholder">' +
          '<div class="icon">' + (zone.insert.icon || "🧍") + '</div>' +
          '<div class="cap">' + zone.insert.caption + '</div>' +
        '</div>';
    }

    const nameTag = document.createElement("div");
    nameTag.className = "portrait-name";
    nameTag.textContent = zone.name;

    const zoneSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    zoneSvg.classList.add("zones", "insert-zone-svg");
    zoneSvg.setAttribute("viewBox", "0 0 768 512");
    zoneSvg.setAttribute("preserveAspectRatio", "none");
    zoneSvg.style.position = "absolute";
    zoneSvg.style.inset = "0";
    zoneSvg.style.width = "100%";
    zoneSvg.style.height = "100%";

    card.appendChild(visual);
    card.appendChild(nameTag);
    card.appendChild(closeBtn);
    card.appendChild(zoneSvg);
    return card;
  }

  function makeInsertCard(zone, depth, parentStack) {
    const card = document.createElement("div");
    card.className = "insert-card";
    const offset = depth * 4;
    card.style.top = (11 - offset) + "%";
    card.style.left = (11 + offset) + "%";
    card.style.width = (78 - offset * 1.4) + "%";
    card.style.height = (78 - offset * 1.4) + "%";
    card.style.zIndex = 10 + depth;

    const head = document.createElement("div");
    head.className = "insert-head";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = (zone.insert.icon || "") + " " + zone.insert.title;
    const closeBtn = document.createElement("button");
    closeBtn.className = "close-btn";
    closeBtn.textContent = "✕";
    closeBtn.title = "Fermer";
    closeBtn.addEventListener("click", () => {
      setInsertStack(parentStack);
    });
    head.appendChild(name);
    head.appendChild(closeBtn);

    const bodyWrap = document.createElement("div");
    bodyWrap.className = "insert-body";

    const placeholder = document.createElement("div");
    placeholder.className = "insert-placeholder";
    if (zone.insert._url) {
      placeholder.style.background = "#000";
      placeholder.innerHTML = '<img src="' + zone.insert._url + '" style="max-width:100%;max-height:100%;object-fit:contain;">';
    } else {
      placeholder.innerHTML =
        '<div class="icon">' + (zone.insert.icon || "🖼️") + '</div>' +
        '<div class="cap">' + zone.insert.caption + '</div>';
    }
    bodyWrap.appendChild(placeholder);

    const zoneSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    zoneSvg.classList.add("zones", "insert-zone-svg");
    zoneSvg.setAttribute("viewBox", "0 0 768 512");
    zoneSvg.setAttribute("preserveAspectRatio", "none");
    zoneSvg.style.position = "absolute";
    zoneSvg.style.inset = "0";
    zoneSvg.style.width = "100%";
    zoneSvg.style.height = "100%";
    bodyWrap.appendChild(zoneSvg);

    card.appendChild(head);
    card.appendChild(bodyWrap);
    return card;
  }

  function renderBreadcrumb() {
    breadcrumbEl.innerHTML = "";
    const root = document.createElement("span");
    root.className = "crumb" + (state.insertStack.length === 0 ? " current" : "");
    root.textContent = diskMode ? (state.sceneId ? (loadedSceneNames[state.sceneId] || state.sceneId) : "Aucune scène chargée") : SCENES[state.sceneId].name;
    root.addEventListener("click", () => setInsertStack([]));
    breadcrumbEl.appendChild(root);

    let stack = [];
    for (let i = 0; i < state.insertStack.length; i++) {
      const id = state.insertStack[i];
      const { list } = findZoneAtLevel(stack);
      const zone = list.find(z => z.id === id);
      if (!zone) break;
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "›";
      breadcrumbEl.appendChild(sep);

      const crumb = document.createElement("span");
      crumb.className = "crumb" + (i === state.insertStack.length - 1 ? " current" : "");
      crumb.textContent = zone.name;
      const targetStack = state.insertStack.slice(0, i + 1);
      crumb.addEventListener("click", () => setInsertStack(targetStack));
      breadcrumbEl.appendChild(crumb);
      stack.push(id);
    }
  }

  function renderZoneInfo() {
    if (state.mode === "player") { zoneInfoEl.innerHTML = ""; return; }
    const zone = state.selectedZoneId ? findZoneAnywhere(state.selectedZoneId) : null;
    if (!zone) {
      zoneInfoEl.innerHTML = '<span class="empty">Clique une zone pour voir ses réglages.</span>';
      return;
    }
    if (state.mode === "edit") {
      renderZoneInfoEdit(zone);
    } else {
      renderZoneInfoReadOnly(zone);
    }
  }

  function renderZoneInfoReadOnly(zone) {
    const typeLabel = { image: "Image insérée", son: "Son / musique", scene: "Changement de scène", personnage: "Personnage" }[zone.type] || zone.type;
    zoneInfoEl.innerHTML =
      row("Nom", zone.name) +
      row("Type", typeLabel) +
      (zone.type === "son" ? row("Mode", zone.soundMode === "unique" ? "Bruitage unique" : "Superposé (on/off)") : "") +
      (zone.type === "scene" ? row("Cible", diskMode ? (loadedSceneNames[zone.target] || zone.target) : (SCENES[zone.target] ? SCENES[zone.target].name : zone.target)) : "");
  }

  function escapeAttr(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }

  function renderZoneInfoEdit(zone) {
    const typeLabel = { image: "Image insérée", son: "Son / musique", scene: "Changement de scène", personnage: "Personnage" }[zone.type] || zone.type;
    zoneInfoEl.innerHTML =
      '<label class="zi-label">Nom</label>' +
      '<input type="text" id="zi-name" value="' + escapeAttr(zone.name) + '">' +
      row("Type", typeLabel) +
      (zone.type === "son" ?
        '<label class="zi-label">Mode sonore</label>' +
        '<select id="zi-sound-mode">' +
          '<option value="superpose"' + (zone.soundMode !== "unique" ? " selected" : "") + '>Superposé (on/off)</option>' +
          '<option value="unique"' + (zone.soundMode === "unique" ? " selected" : "") + '>Bruitage unique</option>' +
        '</select>'
        : "") +
      '<div class="zi-actions">' +
        (diskMode && (zone.type === "image" || zone.type === "personnage") ?
          '<button id="zi-assoc-image">' + ((zone.insert && zone.insert.assetFile) ? "Changer l'image (" + zone.insert.assetFile + ")" : "Associer une image") + '</button>'
          : "") +
        (diskMode && zone.type === "son" ?
          '<button id="zi-assoc-sound">' + (zone.assetFile ? "Changer le son (" + zone.assetFile + ")" : "Associer un son") + '</button>'
          : "") +
        '<button id="zi-redraw">Redessiner la forme</button>' +
        '<button id="zi-delete" class="danger">Supprimer la zone</button>' +
      '</div>';

    const nameInput = zoneInfoEl.querySelector("#zi-name");
    function commitName() {
      const val = nameInput.value.trim();
      if (val && val !== zone.name) {
        zone.name = val;
        renderBaseZones();
        renderInserts();
        renderBreadcrumb();
        if (diskMode) saveSceneToDisk();
      }
    }
    nameInput.addEventListener("blur", commitName);
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { commitName(); nameInput.blur(); }
    });

    const soundSel = zoneInfoEl.querySelector("#zi-sound-mode");
    if (soundSel) {
      soundSel.addEventListener("change", () => {
        zone.soundMode = soundSel.value;
        zone.icon = iconForType(zone.type, zone.soundMode);
        renderBaseZones();
        renderInserts();
        if (diskMode) saveSceneToDisk();
      });
    }

    zoneInfoEl.querySelector("#zi-redraw").addEventListener("click", () => startRedraw(zone));

    const assocImgBtn = zoneInfoEl.querySelector("#zi-assoc-image");
    if (assocImgBtn) {
      assocImgBtn.addEventListener("click", async () => {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: "Images", accept: { "image/*": [".png", ".jpg", ".jpeg", ".webp", ".gif"] } }]
          });
          const file = await handle.getFile();
          const inserts = await currentSceneDirHandle.getDirectoryHandle("inserts", { create: true });
          const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
          const destName = zone.id + "." + ext;
          await writeFileIntoDir(inserts, destName, file);
          if (zone.insert._url) URL.revokeObjectURL(zone.insert._url);
          zone.insert.assetFile = destName;
          zone.insert._url = URL.createObjectURL(file);
          saveSceneToDisk();
          renderInserts();
          renderZoneInfo();
        } catch (e) {}
      });
    }

    const assocSoundBtn = zoneInfoEl.querySelector("#zi-assoc-sound");
    if (assocSoundBtn) {
      assocSoundBtn.addEventListener("click", async () => {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: "Audio", accept: { "audio/*": [".mp3", ".wav", ".ogg", ".m4a"] } }]
          });
          const file = await handle.getFile();
          const sons = await currentSceneDirHandle.getDirectoryHandle("sons", { create: true });
          const ext = (file.name.split(".").pop() || "mp3").toLowerCase();
          const destName = zone.id + "." + ext;
          await writeFileIntoDir(sons, destName, file);
          if (zone._url) URL.revokeObjectURL(zone._url);
          zone.assetFile = destName;
          zone._url = URL.createObjectURL(file);
          delete zoneAudioEls[zone.id];
          saveSceneToDisk();
          renderZoneInfo();
        } catch (e) {}
      });
    }

    zoneInfoEl.querySelector("#zi-delete").addEventListener("click", (e) => {
      const btn = e.currentTarget;
      if (!btn.dataset.confirm) {
        btn.dataset.confirm = "1";
        btn.textContent = "Cliquer à nouveau pour confirmer";
        btn.dataset.timeout = setTimeout(() => {
          btn.dataset.confirm = "";
          btn.textContent = "Supprimer la zone";
        }, 4000);
      } else {
        clearTimeout(Number(btn.dataset.timeout));
        deleteZone(zone);
      }
    });
  }

  function row(k, v) {
    return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  }

  function findZoneAnywhere(id, list) {
    list = list || ZONES;
    for (const z of list) {
      if (z.id === id) return z;
      if (z.insert && z.insert.nested) {
        const found = findZoneAnywhere(id, z.insert.nested);
        if (found) return found;
      }
    }
    return null;
  }

  function findZoneContext(id, list, stackSoFar) {
    list = list || ZONES;
    stackSoFar = stackSoFar || [];
    for (let i = 0; i < list.length; i++) {
      const z = list[i];
      if (z.id === id) return { zone: z, list, index: i, parentStack: stackSoFar.slice() };
      if (z.insert && z.insert.nested) {
        const found = findZoneContext(id, z.insert.nested, stackSoFar.concat(z.id));
        if (found) return found;
      }
    }
    return null;
  }

  function deleteZone(zone) {
    const ctx = findZoneContext(zone.id);
    if (!ctx) return;
    ctx.list.splice(ctx.index, 1);
    if (state.selectedZoneId === zone.id) state.selectedZoneId = null;
    const idx = state.insertStack.indexOf(zone.id);
    if (idx !== -1) state.insertStack = state.insertStack.slice(0, idx);
    broadcastState();
    if (diskMode) saveSceneToDisk();
    render();
  }

  function startRedraw(zone) {
    const ctx = findZoneContext(zone.id);
    if (!ctx) return;
    cancelDrawing();
    setInsertStack(ctx.parentStack);
    startDrawing();
    if (drawing) drawing.replaceZoneId = zone.id;
  }

  function renderHint() {
    if (state.mode === "edit") {
      modeHint.textContent = "Mode édition — aperçu des zones existantes (la création de zone arrivera avec l'éditeur relié au disque).";
    } else if (state.mode === "mj") {
      modeHint.textContent = "Mode MJ — clique une zone pour déclencher son effet.";
    } else {
      modeHint.textContent = "";
    }
  }

  // ---------------------------------------------------------------
  // Interactions
  // ---------------------------------------------------------------

  function onZoneClick(zone, parentStack) {
    state.selectedZoneId = zone.id;

    if (state.mode === "edit") {
      renderZoneInfo();
      return; // en édition on ne fait qu'inspecter, pas de déclenchement réel
    }
    if (state.mode !== "mj") return;

    if (zone.type === "image" || zone.type === "personnage") {
      setInsertStack(parentStack.concat(zone.id));
    } else if (zone.type === "scene") {
      goToScene(zone.target);
    } else if (zone.type === "son") {
      if (zone.soundMode === "unique") {
        if (zone._url) {
          const a = new Audio(zone._url);
          a.play().catch(() => {});
        } else if (state.audioEnabled) {
          playSting();
        }
      } else {
        const nowOn = !state.soundOn[zone.id];
        state.soundOn = { ...state.soundOn, [zone.id]: nowOn };
        if (zone._url) {
          if (!zoneAudioEls[zone.id]) {
            const a = new Audio(zone._url);
            a.loop = true;
            zoneAudioEls[zone.id] = a;
          }
          if (nowOn) zoneAudioEls[zone.id].play().catch(() => {});
          else zoneAudioEls[zone.id].pause();
        } else if (state.audioEnabled) {
          toggleSuperpose(nowOn);
        }
        broadcastState();
        render();
      }
    }
    renderZoneInfo();
  }

  function setInsertStack(stack) {
    state.insertStack = stack;
    broadcastState();
    render();
  }

  function goToScene(sceneId) {
    if (diskMode) {
      loadSceneFromDisk(sceneId);
      return;
    }
    state.sceneId = sceneId;
    state.insertStack = [];
    if (state.audioEnabled) startAmbient(SCENES[sceneId].musicHue);
    broadcastState();
    render();
  }

  document.querySelectorAll(".mode-switch button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-switch button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.mode = btn.dataset.mode;
      if (state.mode === "player") requestStateFromPeers();
      if (state.mode !== "edit") cancelDrawing();
      render();
    });
  });

  // ---------------------------------------------------------------
  // Dessin de zone en lasso (mode édition)
  // ---------------------------------------------------------------

  let drawing = null; // { svg, points, capture, previewLine, vertices[] }

  function iconForType(type, soundMode) {
    if (type === "image") return "🔍";
    if (type === "personnage") return "🧍";
    if (type === "scene") return "🚪";
    if (type === "son") return soundMode === "unique" ? "🎵" : "🔊";
    return "❔";
  }

  function slugify(str) {
    return (str || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "zone";
  }

  function getActiveDrawingSvg() {
    if (state.insertStack.length === 0) return svg;
    const cards = insertLayer.querySelectorAll(".insert-card");
    if (!cards.length) return null;
    return cards[cards.length - 1].querySelector(".insert-zone-svg");
  }

  function getInsertionList(stack) {
    if (stack.length === 0) return ZONES;
    let list = ZONES;
    let current = null;
    for (const id of stack) {
      current = list.find(z => z.id === id);
      if (!current) return null;
      if (!current.insert) current.insert = { title: current.name, caption: "", icon: current.icon };
      if (!current.insert.nested) current.insert.nested = [];
      list = current.insert.nested;
    }
    return list;
  }

  function svgPointFromEvent(svgEl, evt) {
    const pt = svgEl.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    const ctm = svgEl.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const p = pt.matrixTransform(ctm.inverse());
    return { x: p.x, y: p.y };
  }

  const drawToggleBtn = document.getElementById("draw-toggle");
  drawToggleBtn.addEventListener("click", () => {
    if (drawing) { cancelDrawing(); return; }
    startDrawing();
  });

  function startDrawing() {
    const target = getActiveDrawingSvg();
    if (!target) return;
    body.classList.add("drawing-mode");
    drawToggleBtn.classList.add("on");
    drawToggleBtn.textContent = "✕ Annuler le dessin";

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.classList.add("draw-temp");

    const capture = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    capture.setAttribute("x", "0"); capture.setAttribute("y", "0");
    capture.setAttribute("width", "768"); capture.setAttribute("height", "512");
    capture.classList.add("draw-capture");
    g.appendChild(capture);

    const previewLine = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    previewLine.classList.add("draw-preview-line");
    g.appendChild(previewLine);

    target.appendChild(g);

    drawing = { svg: target, points: [], g, capture, previewLine, vertices: [] };

    const bar = document.createElement("div");
    bar.className = "draw-hint-bar";
    bar.id = "draw-hint-bar";
    bar.textContent = "Clique pour poser des points (min. 3) • Entrée pour terminer • Échap pour annuler";
    document.getElementById("stage").appendChild(bar);

    capture.addEventListener("click", onDrawClick);
    document.addEventListener("keydown", onDrawKeydown);
  }

  function onDrawClick(evt) {
    if (!drawing) return;
    const p = svgPointFromEvent(drawing.svg, evt);
    drawing.points.push(p);

    const vertex = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    vertex.classList.add("draw-vertex");
    vertex.setAttribute("cx", p.x);
    vertex.setAttribute("cy", p.y);
    vertex.setAttribute("r", "5");
    drawing.g.appendChild(vertex);
    drawing.vertices.push(vertex);

    updateDrawPreview();
  }

  function updateDrawPreview() {
    const pts = drawing.points.map(p => p.x + "," + p.y).join(" ");
    drawing.previewLine.setAttribute("points", pts);
  }

  function onDrawKeydown(evt) {
    if (evt.key === "Escape") { cancelDrawing(); }
    else if (evt.key === "Enter") { finishDrawing(); }
    else if (evt.key === "Backspace" && drawing && drawing.points.length) {
      drawing.points.pop();
      const v = drawing.vertices.pop();
      if (v) v.remove();
      updateDrawPreview();
    }
  }

  function teardownDrawingVisuals() {
    if (!drawing) return;
    drawing.capture.removeEventListener("click", onDrawClick);
    document.removeEventListener("keydown", onDrawKeydown);
    if (drawing.g.parentNode) drawing.g.remove();
    const bar = document.getElementById("draw-hint-bar");
    if (bar) bar.remove();
    body.classList.remove("drawing-mode");
    drawToggleBtn.classList.remove("on");
    drawToggleBtn.textContent = "✏️ Créer une zone";
  }

  function cancelDrawing() {
    if (!drawing) return;
    teardownDrawingVisuals();
    drawing = null;
  }

  function finishDrawing() {
    if (!drawing || drawing.points.length < 3) return;
    const pointsStr = drawing.points.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    const replaceId = drawing.replaceZoneId;
    const parentStack = state.insertStack.slice();
    teardownDrawingVisuals();
    drawing = null;
    if (replaceId) {
      const ctx = findZoneContext(replaceId);
      if (ctx) ctx.zone.points = pointsStr;
      if (diskMode) saveSceneToDisk();
      render();
    } else {
      openZoneForm(pointsStr, parentStack);
    }
  }

  function openZoneForm(pointsStr, parentStack) {
    const overlay = document.createElement("div");
    overlay.className = "zone-form-overlay";
    overlay.innerHTML =
      '<div class="zone-form">' +
        '<h4>Nouvelle zone</h4>' +
        '<label>Nom de la zone</label>' +
        '<input type="text" id="zf-name" placeholder="Ex. Tiroir du bas">' +
        '<label>Comportement</label>' +
        '<select id="zf-type">' +
          '<option value="image">Image insérée</option>' +
          '<option value="son">Son / musique</option>' +
          '<option value="scene">Changement de scène</option>' +
        '</select>' +
        '<div id="zf-son-mode-wrap">' +
          '<label>Mode sonore</label>' +
          '<select id="zf-son-mode">' +
            '<option value="superpose">Superposé (on/off)</option>' +
            '<option value="unique">Bruitage unique</option>' +
          '</select>' +
        '</div>' +
        '<div id="zf-scene-target-wrap" style="display:none">' +
          '<label>Scène cible</label>' +
          '<select id="zf-scene-target"></select>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button id="zf-cancel">Annuler</button>' +
          '<button id="zf-create" class="primary">Créer la zone</button>' +
        '</div>' +
        '<div class="note">' + (diskMode ? "L'image ou le son associé se choisissent après création, dans le panneau de la zone." : "La création réelle de fichier (image/son associé) arrivera avec le branchement disque — pour l'instant la zone reste en mémoire du navigateur.") + '</div>' +
      '</div>';
    document.getElementById("stage").appendChild(overlay);

    const typeSel = overlay.querySelector("#zf-type");
    const sonWrap = overlay.querySelector("#zf-son-mode-wrap");
    const sceneWrap = overlay.querySelector("#zf-scene-target-wrap");
    const sceneTargetSel = overlay.querySelector("#zf-scene-target");
    if (diskMode) {
      scenesList.forEach(n => {
        if (n === currentSceneName) return;
        const opt = document.createElement("option");
        opt.value = n;
        opt.textContent = loadedSceneNames[n] || n;
        sceneTargetSel.appendChild(opt);
      });
    }
    function syncTypeVisibility() {
      sonWrap.style.display = typeSel.value === "son" ? "block" : "none";
      sceneWrap.style.display = (typeSel.value === "scene" && diskMode) ? "block" : "none";
    }
    syncTypeVisibility();
    typeSel.addEventListener("change", syncTypeVisibility);

    overlay.querySelector("#zf-cancel").addEventListener("click", () => overlay.remove());

    overlay.querySelector("#zf-create").addEventListener("click", () => {
      const nameInput = overlay.querySelector("#zf-name");
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      const type = typeSel.value;
      const soundMode = overlay.querySelector("#zf-son-mode").value;
      const baseId = slugify(name) + "-" + Math.random().toString(36).slice(2, 6);

      const zone = {
        id: baseId,
        name: name,
        points: pointsStr,
        type: type,
        icon: iconForType(type, soundMode)
      };
      if (type === "son") {
        zone.soundMode = soundMode;
        zone.cue = "Zone créée en édition — son à associer plus tard.";
      } else if (type === "image" || type === "personnage") {
        zone.insert = {
          title: name,
          caption: "Emplacement réservé : asset à associer une fois le branchement disque en place.",
          icon: iconForType(type, soundMode)
        };
      } else if (type === "scene") {
        if (diskMode && sceneTargetSel.value) {
          zone.target = sceneTargetSel.value;
        } else if (!diskMode) {
          const sceneId = baseId + "-scene";
          SCENES[sceneId] = { name: name, musicHue: 40 + Math.floor(Math.random() * 300) };
          zone.target = sceneId;
        }
      }

      const list = getInsertionList(parentStack);
      if (list) list.push(zone);
      overlay.remove();
      if (diskMode) saveSceneToDisk();
      render();
    });
  }

  // ---------------------------------------------------------------
  // Synchro MJ -> Joueur (onglets dupliqués) via BroadcastChannel
  // ---------------------------------------------------------------

  function broadcastState() {
    if (!bc) return;
    bc.postMessage({
      type: "state",
      sceneId: state.sceneId,
      insertStack: state.insertStack,
      soundOn: state.soundOn,
      activeNpcOrder: activeNpcOrder
    });
  }
  function requestStateFromPeers() {
    if (!bc) return;
    bc.postMessage({ type: "request-state" });
  }
  if (bc) {
    bc.onmessage = (ev) => {
      const msg = ev.data;
      if (!msg) return;
      if (msg.type === "request-state" && state.mode !== "player") {
        broadcastState();
      } else if (msg.type === "state" && state.mode === "player") {
        state.sceneId = msg.sceneId;
        state.insertStack = msg.insertStack;
        state.soundOn = msg.soundOn;
        activeNpcOrder = msg.activeNpcOrder || [];
        render();
        hydrateActiveNpcImages();
      }
    };
  }

  // ---------------------------------------------------------------
  // Accordéon texte / scénario
  // ---------------------------------------------------------------

  const NOTES = [
    { title: "Chapitre 1 — Ce que savent les PJ", body: "Emplacement réservé : résumé de situation, ce que le groupe sait déjà en arrivant dans le bureau." },
    { title: "Fiches PNJ", body: "Emplacement réservé : statblocks / mobiles des PNJ liés à cette scène." },
    { title: "Indices cachés", body: "Emplacement réservé : liste des indices et où ils sont planqués dans les zones." }
  ];
  const accordionEl = document.getElementById("accordion");
  NOTES.forEach((note, i) => {
    const item = document.createElement("div");
    item.className = "accordion-item";
    item.innerHTML =
      '<div class="acc-head"><span>' + note.title + '</span><span class="acc-arrow">▶</span></div>' +
      '<div class="acc-body"><div class="acc-body-inner">' + note.body + '</div></div>';
    item.querySelector(".acc-head").addEventListener("click", () => {
      item.classList.toggle("open");
    });
    accordionEl.appendChild(item);
  });

  // ---------------------------------------------------------------
  render();
})();
</script>
</body>
</html>
